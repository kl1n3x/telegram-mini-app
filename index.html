<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Loot Market — игровой магазин</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root{color-scheme:dark;--bg:#101216;--panel:#171a20;--line:#2b3039;--text:#f7f7f4;--muted:#a7adb8;--lime:#cbfa4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
button:disabled{cursor:default;opacity:.5}
svg{display:block}
.shell{max-width:1000px;margin:auto;padding:0 clamp(14px,4vw,36px) 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0}
.brand,.basket,.game,.toolbar,.bottom,.total,.cart-line{display:flex;align-items:center}
.brand{gap:10px;font-size:18px;font-weight:800;letter-spacing:-.07em;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:10px;background:var(--lime);color:#161c09;display:grid;place-items:center}
.brand em{color:var(--lime);font-style:normal}
.basket{gap:8px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:9px 11px;font-weight:700}
.badge{min-width:21px;height:21px;display:grid;place-items:center;border-radius:6px;background:var(--lime);color:#161c09;font-size:11px}
.hero{position:relative;min-height:clamp(210px,32vw,294px);display:flex;align-items:center;overflow:hidden;border:1px solid #363e30;border-radius:21px;background:#191e17}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#141a14 5%,#141a14e8 30%,#141a1422 72%);pointer-events:none}

.hero-copy{position:relative;z-index:1;padding:28px clamp(19px,5vw,47px)}
.demo{display:inline-flex;align-items:center;gap:6px;color:var(--lime);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.demo::before{content:"";width:6px;height:6px;background:var(--lime);border-radius:100%;box-shadow:0 0 10px #bafa55}
h1{margin:8px 0 11px;font:800 clamp(30px,6vw,66px)/.94 "Barlow Condensed","Arial Narrow",Inter,sans-serif;letter-spacing:-.045em}
h1 span{display:block;color:var(--lime)}
.hero p{margin:0;color:#d0d6ca;font-size:clamp(11px,2vw,14px);line-height:1.5;max-width:230px}
.catalog{margin-top:26px}
h2{margin:0;font-size:22px;letter-spacing:-.055em}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 26px}
.game{gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--panel);font-weight:800;min-height:60px}
.game[aria-pressed=true]{border-color:var(--lime);background:#20261a}
.game-icon{height:34px;width:34px;flex:none;display:grid;place-items:center;border-radius:9px;background:#ffcd4a;color:#382508}
.game[data-game=pubg] .game-icon{background:#bdc2ad;color:#242921}
.game span:last-child{margin-left:auto;color:var(--muted)}
.game[aria-pressed=true] span:last-child{color:var(--lime)}
.toolbar{justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.filter{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:7px 10px;font-size:12px;color:#c0c5ce}
.filter[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#161c09;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}
.art{height:clamp(95px,17vw,151px);margin:6px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 82%,var(--glow),transparent 68%),repeating-linear-gradient(135deg,#ffffff0a 0px,#ffffff0a 1px,transparent 1px,transparent 13px),var(--tone)}
.art svg{width:min(75%,141px);height:88%;filter:drop-shadow(0 10px 10px #0009)}
.gem{--tone:#172b21;--glow:#396838}.coin{--tone:#2c2518;--glow:#6b4b22}.credit{--tone:#201c37;--glow:#513976}.uc{--tone:#1c2836;--glow:#314f71}.helmet{--tone:#282b20;--glow:#4e592d}.jacket{--tone:#302125;--glow:#6a3943}
.info{padding:7px 11px 11px}
.kind{font-size:10px;color:var(--muted);font-weight:700}
h3{font-size:clamp(14px,2vw,18px);margin:4px 0 11px;letter-spacing:-.035em}
.bottom{justify-content:space-between;gap:6px}
.price{font-size:13px;font-weight:800;white-space:nowrap}
.add,.step button{border:1px solid #3a4430;border-radius:8px;background:#26301e;color:var(--lime);font-weight:800;min-width:38px;height:38px;font-size:19px}
.add:hover,.step button:hover{background:var(--lime);color:#161c09}
dialog{margin:auto;width:min(calc(100% - 26px),470px);max-height:min(85dvh,700px);padding:20px;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);overflow:auto}
dialog::backdrop{background:#080a0cc9}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.close{background:transparent;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:20px}
.cart-line{justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-line small,.note{color:var(--muted);line-height:1.45}
.step{display:flex;align-items:center;gap:7px;white-space:nowrap}
.step button{min-width:32px;height:33px}
.total{justify-content:space-between;padding:16px 0;font-weight:800}
.checkout{width:100%;border:0;border-radius:9px;padding:13px;background:var(--lime);color:#161c09;font-weight:800}
.toast{position:fixed;z-index:2;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);margin:0;max-width:calc(100% - 24px);width:max-content;border-radius:10px;background:var(--lime);color:#161c09;padding:11px 14px;font-weight:800;box-shadow:0 5px 25px #0008}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hero-art{background-position:66% center}.hero::after{background:linear-gradient(90deg,#131912 0%,#131912dc 35%,#13191222 100%)}.top{padding:15px 0}.game{font-size:12px;padding:8px;gap:7px}.games{margin-bottom:19px}.game-icon{width:30px;height:30px}}
</style>
</head>

</svg>

<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark"><svg width="19" height="19" aria-hidden="true"><use href="#bolt"/></svg></span><span>LOOT <em>MARKET</em></span></div>
    <button class="basket" id="open-cart" type="button"><svg width="19" height="19" aria-hidden="true"><use href="#bag"/></svg>Корзина <span class="badge" id="count">0</span></button>
  </header>
  <main>
    <section class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="hero-copy">
        <span class="demo">Демо-магазин</span>
        <h1>Игровая валюта<span>и предметы</span></h1>
        <p>Gems, монеты, UC и скины.</p>
      </div>
    </section>
    <section class="catalog" aria-labelledby="games-title">
      <h2 id="games-title">Выбери игру</h2>
      <div class="games" id="games">
        <button class="game" type="button" data-game="brawl" aria-pressed="true"><span class="game-icon"><svg width="20" height="20" aria-hidden="true"><use href="#skull"/></svg></span>Brawl Stars<span aria-hidden="true">↗</span></button>
        <button class="game" type="button" data-game="pubg" aria-pressed="false"><span class="game-icon"><svg width="20" height="20" aria-hidden="true"><use href="#helmet-mark"/></svg></span>PUBG Mobile<span aria-hidden="true">↗</span></button>
      </div>
      <div class="toolbar"><h2 id="catalog-title">Brawl Stars</h2><div class="filters" id="filters" role="group" aria-label="Категории товаров"></div></div>
      <div class="grid" id="products" aria-labelledby="catalog-title"></div>
    </section>
  </main>
</div>
<p class="toast" id="toast" role="status" hidden></p>
<dialog id="cart" aria-labelledby="cart-title">
  <div class="dialog-head"><h2 id="cart-title">Корзина</h2><button class="close" type="button" aria-label="Закрыть корзину" autofocus>×</button></div>
  <p class="note">Демо-режим. Оплата и выдача товаров отключены.</p>
  <div id="cart-items"></div>
  <div class="total"><span>Итого</span><span id="total"></span></div>
  <button class="checkout" id="checkout" type="button">Оформить демо-заказ</button>
</dialog>

<script>
const games = {
  brawl: {
    title: 'Brawl Stars',
    categories: { gem: 'Gems', coin: 'Монеты', credit: 'Кредиты' },
    products: [
      ['g80', 'gem', '80 Gems', 89], ['c1000', 'coin', '1 000 монет', 45],
      ['g170', 'gem', '170 Gems', 169], ['c2500', 'coin', '2 500 монет', 99],
      ['b500', 'credit', '500 кредитов', 59], ['g360', 'gem', '360 Gems', 329],
    ],
  },
  pubg: {
    title: 'PUBG Mobile',
    categories: { uc: 'UC', skin: 'Скины' },
    products: [
      ['u60', 'uc', '60 UC', 29], ['u325', 'uc', '325 UC', 119],
      ['h1', 'skin', 'Шлем «Фантом»', 149, 'helmet'], ['u660', 'uc', '660 UC', 229],
      ['j1', 'skin', 'Куртка «Рейдер»', 189, 'jacket'], ['u1800', 'uc', '1 800 UC', 519],
    ],
  },
};
const allProducts = Object.fromEntries(Object.values(games).flatMap(game =>
  game.products.map(([id, category, title, price, art]) => [
    id, { id, category, title, price, art: art || category, game: game.title, label: game.categories[category] },
  ])
));
const storageKey = 'loot-market-demo-cart';
let cart = {};
try {
  const saved = JSON.parse(localStorage.getItem(storageKey)) || {};
  cart = Object.fromEntries(Object.entries(saved).filter(([id, quantity]) =>
    Object.hasOwn(allProducts, id) && Number.isInteger(quantity) && quantity > 0 && quantity <= 99
  ));
} catch {}
let activeGame = 'brawl';
let activeCategory = 'all';
let toastTimer;

const byId = id => document.getElementById(id);
const dialog = byId('cart');
const money = new Intl.NumberFormat('ru-MD');
const formatPrice = price => money.format(price) + ' MDL';

function renderCatalog() {
  const game = games[activeGame];
  byId('catalog-title').textContent = game.title;
  byId('games').querySelectorAll('button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.game === activeGame));
  });
  byId('filters').innerHTML = Object.entries({ all: 'Все', ...game.categories }).map(([id, label]) =>
    `<button class="filter" type="button" data-category="${id}" aria-pressed="${id === activeCategory}">${label}</button>`
  ).join('');
  byId('products').innerHTML = game.products
    .map(([id]) => allProducts[id])
    .filter(product => activeCategory === 'all' || activeCategory === product.category)
    .map(product => `<article class="card">
      <div class="art ${product.art}"><svg aria-hidden="true" viewBox="0 0 128 100"><use href="#${product.art}"/></svg></div>
      <div class="info"><span class="kind">${product.label}</span><h3>${product.title}</h3>
      <div class="bottom"><span class="price">${formatPrice(product.price)}</span><button type="button" class="add" data-id="${product.id}" aria-label="Добавить ${product.title} в корзину">+</button></div></div>
    </article>`).join('');
}

function renderCart() {
  const items = Object.entries(cart);
  const count = items.reduce((sum, [, quantity]) => sum + quantity, 0);
  const total = items.reduce((sum, [id, quantity]) => sum + allProducts[id].price * quantity, 0);
  byId('count').textContent = count;
  byId('total').textContent = formatPrice(total);
  byId('checkout').disabled = !count;
  byId('cart-items').innerHTML = items.length ? items.map(([id, quantity]) => {
    const product = allProducts[id];
    return `<div class="cart-line"><div><strong>${product.title}</strong><br><small>${product.game} · ${formatPrice(product.price)}</small></div>
      <div class="step"><button type="button" data-id="${id}" data-delta="-1" aria-label="Убрать одну позицию ${product.title}">−</button>
      <span>${quantity}</span><button type="button" data-id="${id}" data-delta="1" aria-label="Добавить одну позицию ${product.title}" ${quantity === 99 ? 'disabled' : ''}>+</button></div></div>`;
  }).join('') : '<p class="note">Корзина пока пуста.</p>';
}

function saveCart() {
  try { localStorage.setItem(storageKey, JSON.stringify(cart)); } catch {}
  renderCart();
}

function updateQuantity(id, change) {
  const current = cart[id] || 0;
  const quantity = Math.max(0, Math.min(99, current + change));
  if (quantity === current) return false;
  if (quantity) cart[id] = quantity;
  else delete cart[id];
  saveCart();
  return true;
}

function notify(message) {
  const toast = byId('toast');
  toast.hidden = false;
  toast.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
}

byId('games').addEventListener('click', event => {
  const button = event.target.closest('[data-game]');
  if (!button || button.dataset.game === activeGame) return;
  activeGame = button.dataset.game;
  activeCategory = 'all';
  renderCatalog();
});
byId('filters').addEventListener('click', event => {
  const button = event.target.closest('[data-category]');
  if (!button) return;
  activeCategory = button.dataset.category;
  renderCatalog();
  byId('filters').querySelector('[aria-pressed="true"]').focus({ preventScroll: true });
});
byId('products').addEventListener('click', event => {
  const button = event.target.closest('[data-id]');
  if (!button) return;
  const added = updateQuantity(button.dataset.id, 1);
  notify(added ? 'Товар добавлен в корзину' : 'Лимит для одного товара — 99 шт.');
});
byId('open-cart').addEventListener('click', () => dialog.showModal());
dialog.querySelector('.close').addEventListener('click', () => dialog.close());
byId('cart-items').addEventListener('click', event => {
  const button = event.target.closest('[data-delta]');
  if (!button) return;
  const { id, delta } = button.dataset;
  updateQuantity(id, Number(delta));
  const replacement = byId('cart-items').querySelector(`[data-id="${id}"][data-delta="${delta}"]:enabled`);
  (replacement || dialog.querySelector('.close')).focus();
});
byId('checkout').addEventListener('click', () => {
  if (!Object.keys(cart).length) return;
  cart = {};
  saveCart();
  dialog.close();
  notify('Демо-заказ оформлен. Оплаты не было.');
});

renderCatalog();
renderCart();

const telegramScript = document.createElement('script');
telegramScript.src = 'https://telegram.org/js/telegram-web-app.js';
telegramScript.onload = () => window.Telegram?.WebApp?.ready();
document.head.append(telegramScript);
</script>
</body>
</html>
